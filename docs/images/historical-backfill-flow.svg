<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Historical Power BI Usage Metrics backfill flow</title>
<desc id="desc">Illustrative flow based on the provided screenshots: recurrence trigger, DAX query for a selected date batch, apply to each result row, create SharePoint list item. Animated dots show the data path.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1677ff"/><stop offset="1" stop-color="#0052cc"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17345b" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c87ac"/></marker>
</defs>
<rect width="1000" height="760" rx="24" fill="url(#bg)"/>
<text x="50" y="56" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#142b4a">Historical backfill · Power BI Usage Metrics</text>
<text x="50" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#536985">Illustrative animation based on the flow screenshots · sanitized example</text>
<rect x="50" y="115" width="900" height="88" rx="15" fill="#fff" stroke="#d6e2f2"/>
<text x="76" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#506783">BATCH WINDOW — EDIT THE DAX DATES BEFORE EACH RUN</text>
<rect x="76" y="160" width="185" height="29" rx="7" fill="#e4efff"/><text x="91" y="180" font-family="Consolas,monospace" font-size="14" fill="#174ea6">Start: 2026-10-11</text>
<rect x="273" y="160" width="185" height="29" rx="7" fill="#e4efff"/><text x="288" y="180" font-family="Consolas,monospace" font-size="14" fill="#174ea6">End: 2026-10-25</text>
<text x="490" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#647894">Example dates only — replace for each batch</text>
<g filter="url(#shadow)">
  <rect x="185" y="238" width="630" height="92" rx="17" fill="#fff" stroke="#b8d1f4" stroke-width="1.5"/>
  <rect x="185" y="238" width="12" height="92" rx="6" fill="url(#blue)"/>
  <circle cx="232" cy="284" r="23" fill="#e7f0ff"/><path d="M232 268 v17 l12 7" fill="none" stroke="#1265d8" stroke-width="3" stroke-linecap="round"/><circle cx="232" cy="284" r="14" fill="none" stroke="#1265d8" stroke-width="2.5"/>
  <text x="272" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17345b">1. Recurrence</text>
  <text x="272" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5a6e88">Monthly trigger shown in the supplied flow definition</text>
  <rect x="185" y="370" width="630" height="104" rx="17" fill="#fff" stroke="#b8d1f4" stroke-width="1.5"/>
  <rect x="185" y="370" width="12" height="104" rx="6" fill="#e6b72e"/>
  <rect x="211" y="394" width="42" height="42" rx="9" fill="#fff5d6"/><path d="M222 406 h20 M222 413 h20 M222 420 h14" stroke="#8d6b00" stroke-width="2.5" stroke-linecap="round"/>
  <text x="272" y="406" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17345b">2. Run a query against a dataset</text>
  <text x="272" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5a6e88">DAX filters the Usage Metrics model to the selected date range</text>
  <rect x="185" y="514" width="630" height="82" rx="17" fill="#fff" stroke="#b8d1f4" stroke-width="1.5"/>
  <rect x="185" y="514" width="12" height="82" rx="6" fill="#647b98"/>
  <g stroke="#647b98" stroke-width="2.5" fill="none"><rect x="215" y="535" width="32" height="8" rx="3"/><rect x="215" y="547" width="32" height="8" rx="3"/><rect x="215" y="559" width="32" height="8" rx="3"/></g>
  <text x="272" y="548" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17345b">3. Apply to each</text>
  <text x="272" y="574" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5a6e88">Loop through the returned table rows</text>
  <rect x="185" y="636" width="630" height="82" rx="17" fill="#fff" stroke="#b8d1f4" stroke-width="1.5"/>
  <rect x="185" y="636" width="12" height="82" rx="6" fill="#149b78"/>
  <g fill="none" stroke="#149b78" stroke-width="2.5"><path d="M217 659 h30 v32 h-30 z"/><path d="M222 666 h20 M222 673 h20 M222 680 h14"/></g>
  <text x="272" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17345b">4. Create item in SharePoint</text>
  <text x="272" y="696" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5a6e88">Save usage date, page, metrics and capture timestamp</text>
</g>
<g stroke="#6c87ac" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <path d="M500 330 V360"/><path d="M500 474 V504"/><path d="M500 596 V626"/>
</g>
<g fill="#1677ff">
  <circle r="6"><animate attributeName="cy" values="332;356" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle r="6"><animate attributeName="cy" values="476;500" dur="1.2s" begin=".35s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.25;1" dur="1.2s" begin=".35s" repeatCount="indefinite"/></circle>
  <circle r="6"><animate attributeName="cy" values="598;622" dur="1.2s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.25;1" dur="1.2s" begin=".7s" repeatCount="indefinite"/></circle>
</g>
</svg>