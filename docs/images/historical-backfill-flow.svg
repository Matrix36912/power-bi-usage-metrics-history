<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Power BI Usage Metrics historical backfill flow</title><desc id="desc">Technical flow diagram based on the provided Power Automate screenshots. The DAX date filter uses the user's example dates February 10 through February 17, 2026. Tenant-specific details are omitted.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3f9"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#657b94"/></marker><style>.h{font-family:Segoe UI,Arial,sans-serif;fill:#17365d}.body{font-family:Segoe UI,Arial,sans-serif;fill:#304c6b}.mono{font-family:Consolas,monospace;fill:#203c5c;font-size:15px}.label{font-family:Segoe UI,Arial,sans-serif;fill:#fff;font-weight:700;font-size:20px}</style></defs>
<rect width="1200" height="1120" fill="url(#bg)"/>
<text x="40" y="54" class="h" font-size="32" font-weight="700">Power BI Usage Metrics — Historical Backfill</text>
<text x="40" y="84" class="body" font-size="18">Power Automate → Power BI Usage Metrics → SharePoint · Process one date batch at a time</text>
<rect x="40" y="108" width="1120" height="100" rx="12" fill="#fff" stroke="#c7d7e8"/>
<circle cx="78" cy="157" r="23" fill="#1677c8"/><text x="78" y="164" text-anchor="middle" class="label">1</text>
<text x="116" y="145" class="h" font-size="22" font-weight="700">Recurrence trigger</text><text x="116" y="174" class="body" font-size="16">Monthly interval shown in the supplied flow. Manage batches intentionally; the trigger does not automatically iterate date ranges.</text>
<rect x="825" y="128" width="300" height="58" rx="8" fill="#edf5ff" stroke="#c2dcf7"/><text x="845" y="151" class="body" font-size="15">Frequency: Month</text><text x="845" y="173" class="body" font-size="15">Interval: 1 · Time zone: UTC+05:30</text>
<path d="M600 208 V229" stroke="#657b94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="238" width="1120" height="600" rx="12" fill="#fff" stroke="#c7d7e8"/>
<circle cx="78" cy="276" r="23" fill="#d9a000"/><text x="78" y="283" text-anchor="middle" class="label">2</text>
<text x="116" y="283" class="h" font-size="22" font-weight="700">Run a query against a dataset</text>
<text x="116" y="310" class="body" font-size="16">Dataset: Usage Metrics Report · Query includes Date, PageName, User, TotalPageUsers, TotalPageViews and PageViewShare.</text>
<rect x="70" y="332" width="1060" height="408" rx="8" fill="#fbfdff" stroke="#b9cce0"/>
<rect x="70" y="332" width="1060" height="40" rx="8" fill="#eaf2fb"/><text x="90" y="358" class="h" font-size="16" font-weight="700">DAX QUERY · EXAMPLE BATCH: 10–17 FEB 2026 (INCLUSIVE)</text>
<g class="mono">
<text x="92" y="400">EVALUATE</text>
<text x="92" y="423">SELECTCOLUMNS(</text>
<text x="112" y="446">FILTER(</text>
<text x="132" y="469">SUMMARIZECOLUMNS(</text>
<text x="152" y="492">'Dates'[Date],</text>
<text x="152" y="515">'Report pages'[SectionName],</text>
<text x="152" y="538">'Report page views'[UserKey],</text>
<text x="152" y="561">"TotalPageUsers", [Total page users],</text>
<text x="152" y="584">"TotalPageViews", [Total page views],</text>
<text x="152" y="607">"PageViewShare", [Page view share]</text>
<text x="132" y="630">),</text>
<text x="112" y="653">'Dates'[Date] &gt;= DATE(2026, 2, 10) &amp;&amp;</text>
<text x="112" y="676">'Dates'[Date] &lt;= DATE(2026, 2, 17)</text>
<text x="92" y="699">),</text>
<text x="92" y="722">... then SELECTCOLUMNS maps Date, PageName, User, TotalPageUsers, TotalPageViews, PageViewShare</text>
</g>
<rect x="70" y="755" width="1060" height="58" rx="8" fill="#fff4d6" stroke="#e8c76b"/><text x="90" y="779" class="body" font-size="15" font-weight="700">For the next batch:</text><text x="90" y="800" class="body" font-size="15">Change both DATE values; use consecutive, non-overlapping windows and validate each run before continuing.</text>
<path d="M600 838 V859" stroke="#657b94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="868" width="540" height="112" rx="12" fill="#fff" stroke="#c7d7e8"/>
<circle cx="78" cy="906" r="23" fill="#6b61c9"/><text x="78" y="913" text-anchor="middle" class="label">3</text><text x="116" y="907" class="h" font-size="21" font-weight="700">Apply to each</text><text x="116" y="935" class="body" font-size="16">Input: first table rows returned by the query.</text><text x="116" y="958" class="body" font-size="15">Process each result row separately.</text>
<rect x="600" y="868" width="560" height="112" rx="12" fill="#fff" stroke="#c7d7e8"/>
<circle cx="638" cy="906" r="23" fill="#159b78"/><text x="638" y="913" text-anchor="middle" class="label">4</text><text x="676" y="907" class="h" font-size="21" font-weight="700">Create item in SharePoint</text><text x="676" y="935" class="body" font-size="15">UsageDate ← Date · PageName ← PageName</text><text x="676" y="958" class="body" font-size="15">Metrics ← query values · CaptureDate ← utcNow()</text>
<rect x="40" y="1000" width="1120" height="82" rx="12" fill="#e8f4ed" stroke="#b7d8c2"/>
<text x="62" y="1028" class="h" font-size="18" font-weight="700">Batch checklist</text><text x="62" y="1055" class="body" font-size="16">Edit dates → Save → Run → Check run history → Validate SharePoint rows → Record range → Repeat.</text>
<text x="40" y="1105" class="body" font-size="13">Sanitized technical illustration based on supplied screenshots. Tenant URL and workspace, dataset, and list IDs are omitted.</text>
</svg>